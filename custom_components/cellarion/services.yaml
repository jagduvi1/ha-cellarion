# Field labels and descriptions are translated in strings.json
# (services.consume_bottle); this file defines structure and selectors only.
consume_bottle:
  fields:
    bottle_id:
      required: true
      example: "6a50805b785f507654afdc51"
      selector:
        text:
    reason:
      default: drank
      selector:
        select:
          options:
            - drank
            - gifted
            - sold
            - other
    rating:
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          mode: box
    note:
      selector:
        text:
          multiline: true
    entry_id:
      selector:
        config_entry:
          integration: cellarion
