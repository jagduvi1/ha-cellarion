[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["custom_components/cellarion"]

[tool.coverage.report]
# The bar is set just under where the suite stands, so a regression fails
# CI while an unrelated refactor doesn't.
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = [
  "E501",   # long lines: left to the formatter
  "RUF012", # HA entity description tuples are the convention
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.cellarion"]
force-sort-within-sections = true
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_unreachable = true
